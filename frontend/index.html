<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ModelMesh Dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    input, button { padding: 0.5rem; margin: 0.25rem 0; width: 100%; box-sizing: border-box; }
    pre { background: #f4f4f5; padding: 1rem; overflow: auto; border-radius: 8px; }
    h1 { font-size: 1.5rem; }
  </style>
</head>
<body>
  <h1>ModelMesh — Usage Dashboard</h1>
  <label>API Key <input id="key" type="password" placeholder="Bearer sk-..." /></label>
  <button id="load">Load usage & providers</button>
  <h2>Usage</h2>
  <pre id="usage">—</pre>
  <h2>Providers</h2>
  <pre id="providers">—</pre>
  <script>
    document.getElementById('load').onclick = async () => {
      const key = document.getElementById('key').value.trim();
      const headers = { Authorization: 'Bearer ' + key };
      const [u, p] = await Promise.all([
        fetch('/usage', { headers }).then(r => r.json()),
        fetch('/providers').then(r => r.json()),
      ]);
      document.getElementById('usage').textContent = JSON.stringify(u, null, 2);
      document.getElementById('providers').textContent = JSON.stringify(p, null, 2);
    };
  </script>
</body>
</html>
